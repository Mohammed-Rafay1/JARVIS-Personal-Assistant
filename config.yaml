# JARVIS settings. Restart Jarvis after editing.

address_as: "sir"            # how Jarvis addresses you

wake_word:
  enabled: true
  model: hey_jarvis          # pretrained openWakeWord model
  threshold: 0.20            # lower (0.35) if it misses you, raise (0.6) if it wakes by accident
  threshold_while_speaking: 0.75
  verifier_trigger: 0.03     # stock score at which your voice model takes over
  verifier: ""               # your own "Hey Jarvis" model from calibrate_wake.bat ("" = the standard one)
  whisper_backup: true       # also spot "Hey Jarvis" with speech recognition (helps accents the model misses)
  verify_below: 0.50         # a weaker hit only wakes Jarvis if speech recognition hears "Jarvis" (stops videos/TV waking it)
  accept_unheard_above: 0.27 # ...or if it hears nothing at all and the hit was at least this strong (a quiet "Hey Jarvis")
  near_peak: 0.16            # only short phrases at least this loud (you, at the laptop) are checked

mic:
  gain: 5.4                  # software boost for a quiet mic; calibrate_wake.bat sets this for you
  auto_level: true           # keep your voice at a steady level (learns from your speech only; each mic remembered)

voice_id:                    # recognise your voice (calibrate_wake.bat makes your voiceprint)
  enabled: false             # off (17 Nov): it was refusing your own voice with "not my boss"
  keep_off: true             # calibrate_wake.bat won't switch it back on; set false and enabled true to use it
  model: "data/models/speaker/wespeaker_en_voxceleb_resnet34.onnx"
  profile: "data/voice/voiceprint.npz"
  match_threshold: 0.75      # a whole spoken command must score this to count as you
  short_threshold: 0.70      # a short command (about a second of voice)
  wake_reject: 0.64          # "Hey Jarvis" below this is clearly someone else
  lock_wake: true            # "Hey Jarvis" from a clearly different voice: "Sorry, you're not my boss"
  lock_commands: true        # a spoken command that isn't yours is refused the same way
  lock_barge_in: true        # a clearly different voice can't cut in while Jarvis speaks
  lock_listening: false      # mid-sentence checks on 1.5 s of audio (too little voice to be reliable)
  stranger_reply: "Sorry, you're not my boss."

hotkey: "Control+Alt+J"      # talk or type
listening:
  silence_ms: 600            # pause length that ends your sentence
  short_silence_ms: 1000     # longer pause allowed after just a word or two ("Jarvis, ... open Chrome"); = silence_ms to turn off
  max_seconds: 40            # longest single stretch of talking (17 Nov: 12 cut a story off mid-sentence)
  no_speech_timeout: 5       # give up if you say nothing after waking it
  follow_up_seconds: 6       # after Jarvis asks you something (send it? which file?), answer without the wake word
  follow_up_after_chat: false # also keep listening when a chat answer ends in a question (noisy rooms: keep off)
  vad: silero                # who decides you're speaking while Jarvis listens: silero (19 Nov: caught 75% of your
                             # speech vs 47%, cut you off in 2/25 clips vs 11/25) | webrtc
  vad_model: "data/models/vad/silero_vad.onnx"
  vad_threshold: 0.5         # Silero: lower hears quieter speech, higher ignores more noise
  vad_aggressiveness: 2      # WebRTC VAD (idle listening, and the fallback): 0-3, higher ignores more noise

call:                        # "Hey Jarvis" opens a full-screen call that keeps listening
  first_timeout: 8           # end quietly if nothing is said right after waking (accidental wake)
  idle_timeout: 90           # end after this many seconds of silence (say "bye" or press X to end sooner)
  greeting: true             # "Yes, sir?" when you call; the full "Good evening, sir. Systems are online..." only after a long break
  full_greeting_hours: 3     # hours without a call before the full greeting plays again
  barge_in: true             # start talking while Jarvis speaks and it stops to listen
  barge_in_ratio: 2.5        # how much louder than Jarvis's own echo your voice must be (raise if it interrupts itself)
  rethink_min_rms: 1800      # how loud speech must be to interrupt Jarvis while it's thinking (raise if other voices interrupt it)

stt:
  engine: parakeet           # parakeet = NVIDIA Parakeet TDT 0.6B (18 Nov: ~7x fewer mistakes in room noise and
                             # 2-3x faster than Whisper on your recordings) | whisper = the two settings below
  parakeet_model: "data/models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8"
  model: base.en             # Whisper (used if Parakeet is missing): fast first pass
  accurate_model: small.en   # re-checks only when the fast pass is unsure (accents, names); "" to turn off
  retry_below: -0.6          # confidence below which the re-check runs (lower = fewer re-checks, faster)
  retry_max_seconds: 6       # longer clips skip the re-check (it took 8-20 s on them); clear commands always skip it
  compute_type: int8
  threads: 4

tts:
  engine: auto               # auto = piper (fast) | kokoro (most natural, ~6x slower on this laptop) | sapi
  piper_voice: en_GB-alan-medium
  voice: bm_george           # Kokoro voice: bm_george, bm_lewis, bm_daniel
  speed: 1.05
speak_typed_replies: false   # typed commands get silent, on-screen replies (handy in meetings)
greet_on_start: true

llm:
  enabled: true
  model: qwen2.5:1.5b        # 18 Nov: 3x faster than qwen2.5:3b on this laptop (12 vs 4-6 words-pieces/s,
                             # one RAM stick limits it), answers as good on the tests; no gaps mid-reply
  host: http://127.0.0.1:11434
  keep_alive: 8h             # unloads from RAM (~1.1 GB) after this much idle time; reloading costs ~10 s on the next question
  first_reply_seconds: 20    # give up (and say so) if the answer hasn't started by then; +25 s when the model is still loading
  filler_after_seconds: 4    # say "Just a moment, sir." if the answer is slower than this
  temperature: 0.6           # conversation liveliness: lower = more predictable, higher = chattier
  max_reply_tokens: 240      # longest answer the model may write
  max_spoken_sentences: 4    # Jarvis stops after this many sentences: a spoken answer, not a lecture

music:
  default_service: youtube   # used for "play X" with no service named: youtube | spotify

ducking:
  enabled: true              # lower other apps' audio while you talk to Jarvis
  level: 0.25

claude_code:
  allow_tasks: true          # prompts for Claude Code: Jarvis asks which project and which chat, reads it back, sends on "send it" (false = read-only)
  new_project_dir: "~/Desktop"   # where "new project" creates its folder
  ai_summary: false          # true = local-AI summary (nicer wording, but over a minute on this laptop)
  # After "send it", Claude Code works in the background and Jarvis tells you when it's done: out loud, or on
  # WhatsApp if you sent the task from your phone (or the laptop is locked). false = open a terminal instead.
  background: true
  # It may create and edit files inside that project. Anything else it would normally ask about first
  # (other commands, the web) is refused and listed in the report, except these commands:
  permission_mode: acceptEdits
  allowed_tools: ["Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)", "Bash(npm test:*)",
                  "Bash(npm run test:*)", "Bash(npm run lint:*)", "Bash(npm run build:*)", "Bash(pytest:*)",
                  "Bash(python -m pytest:*)"]
  max_minutes: 30            # a task still running after this is stopped

files:
  search_roots: ["~"]        # where file search looks

weather:
  city: "Lahore"             # used when you ask about the weather without naming a place (Open-Meteo, no key)

office:
  save_folder: "~/Documents" # where new Excel and Word files go when you say "save it" and give a name

email:
  enabled: true              # connected with an app password
  poll_seconds: 60
  announce: true
  only_primary: true         # skip Promotions / Social / Updates
  vip: []                    # always announce these senders, e.g. ["boss@example.com"]
  quiet_hours: ["22:00", "07:30"]
  hold_during_calls: true    # wait until Teams/Zoom stops using the mic
  signature: ""              # appended to emails Jarvis writes

apps:
  aliases:
    vs code: Visual Studio Code
    vscode: Visual Studio Code
    code: Visual Studio Code
    word: Word
    powerpoint: PowerPoint
    teams: Microsoft Teams
    browser: Google Chrome
    chrome: Google Chrome
    edge: Microsoft Edge
    file explorer: File Explorer
    explorer: File Explorer
    calculator: Calculator
    notepad: Notepad
    settings: Settings
    terminal: Terminal
    task manager: Task Manager
    claude code: Claude
    claude: Claude

websites:
  google: https://www.google.com
  youtube: https://www.youtube.com
  gmail: https://mail.google.com
  github: https://github.com
  linkedin: https://www.linkedin.com
  chatgpt: https://chatgpt.com
  claude: https://claude.ai
  whatsapp: https://web.whatsapp.com
  google drive: https://drive.google.com
  drive: https://drive.google.com
  calendar: https://calendar.google.com
  maps: https://maps.google.com
  google maps: https://maps.google.com
  stack overflow: https://stackoverflow.com
  wikipedia: https://www.wikipedia.org
  netflix: https://www.netflix.com
  spotify web: https://open.spotify.com

ui:
  idle_dock: true            # small orb in the corner when idle (false = hide completely)

board:                       # "show my board": today's list, inbox, projects, systems on one glass screen
  enabled: true
  morning: true              # open the board, brief you and ask today's plan (out loud and on WhatsApp)
  morning_at: "09:00"        # the first time Jarvis is on after this (and before morning_until)
  morning_until: "14:00"
  evening: true              # end-of-day wrap-up: what got done, what moves to tomorrow
  evening_at: "18:30"
  remind_on_whatsapp: true   # reminders also arrive on WhatsApp

whatsapp_remote:             # command Jarvis from your phone: text or voice notes on WhatsApp
  enabled: true
  self_chat: true            # your "Message yourself" chat on the linked WhatsApp account works as a remote
  allowed: []                # other numbers that may command Jarvis, international format, e.g. ["923001234567"]
  voice_replies: true        # answer a voice note with a voice note as well as text
  phone: ""                  # optional: link with an 8-digit code instead of a QR code (number to link, international format)
